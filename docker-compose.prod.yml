# Production (VPS) : utilisé par le workflow CD.
# IMAGE est injectée par le déploiement (ex. ghcr.io/owner/jobmatch:sha-abc123).
x-app: &app
  image: ${IMAGE:-ghcr.io/OWNER/jobmatch:latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - media:/app/media
    - hf-cache:/var/cache/huggingface
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobmatch}
      POSTGRES_USER: ${POSTGRES_USER:-jobmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  web:
    <<: *app
    command: web
    environment:
      RUN_MIGRATIONS: "0"  # les migrations sont lancées explicitement par le CD
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: worker

  beat:
    <<: *app
    command: beat

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
    depends_on: [web]

volumes:
  pgdata:
  redisdata:
  media:
  hf-cache:
