# Environnement de développement : `docker compose up --build`
# L'image est construite UNE seule fois (service web) puis réutilisée par worker et beat.
# Build léger sans torch : INSTALL_ML=0 dans .env + EMBEDDER_BACKEND=fake
x-app: &app
  image: jobmatch:dev
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://postgres:postgres@db:5432/jobmatch
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/app
    - hf-cache:/var/cache/huggingface
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobmatch"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-1}
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    entrypoint: []
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: worker

  beat:
    <<: *app
    command: beat

volumes:
  pgdata:
  hf-cache:
